name: Product side-seven isolated multiplicity-two cases 1287 through 1289

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/product-side-seven-m2-isolated-1287-1289.yml

permissions:
  contents: read

jobs:
  measure:
    name: case-${{ matrix.case_index }}-orientation-${{ matrix.orientation }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        case_index: [1287, 1288, 1289]
        orientation: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - name: Check durable trigger
        id: gate
        shell: bash
        run: |
          if grep -qx 'run-isolated-1287-1289' .github/product-side-seven-m2-isolated-1287-trigger.txt; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Compile isolated exact tool
        if: steps.gate.outputs.run == 'true'
        run: >-
          g++ -O3 -std=c++17
          scripts/measure_product_side_seven_single_case_orientation.cpp
          -o /tmp/measure-product-side-seven-single
      - name: Measure isolated exact result
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -o pipefail
          /tmp/measure-product-side-seven-single \
            "${{ matrix.case_index }}" "${{ matrix.orientation }}" 2 \
            | tee "product-side-seven-m2-${{ matrix.case_index }}-o${{ matrix.orientation }}.txt"
          grep -q ' INFEASIBLE$' "product-side-seven-m2-${{ matrix.case_index }}-o${{ matrix.orientation }}.txt"
      - name: Upload exact transcript
        if: always() && steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: product-side-seven-m2-${{ matrix.case_index }}-o${{ matrix.orientation }}
          path: product-side-seven-m2-${{ matrix.case_index }}-o${{ matrix.orientation }}.txt
          if-no-files-found: error

# Durable registration: retain until all twelve isolated transcripts are promoted.
