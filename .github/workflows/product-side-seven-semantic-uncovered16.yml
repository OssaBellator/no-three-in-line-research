name: Product side-seven semantic uncovered-top expansion 16

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/product-side-seven-semantic-uncovered16.yml
      - scripts/measure_product_side_seven_multiplicity2_case0_orientation3_semantic_uncovered16.cpp
      - scripts/measure_product_side_seven_multiplicity2_case0_orientation3_semantic_vocabulary_full192_relaxed.cpp
      - scripts/measure_product_side_seven_multiplicity2_case0_orientation3_semantic_cover_core.cpp
      - scripts/product_side_seven_cache_engine.hpp
  workflow_dispatch:

concurrency:
  group: product-side-seven-semantic-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Compile uncovered-top semantic census
        run: >-
          g++ -O3 -std=c++17
          scripts/measure_product_side_seven_multiplicity2_case0_orientation3_semantic_uncovered16.cpp
          -o /tmp/semantic-uncovered16
      - name: Measure exact semantic expansion
        shell: bash
        run: |
          set -o pipefail
          /tmp/semantic-uncovered16 | tee semantic-uncovered16.txt
          grep -Eq '^FINAL .* PASS$' semantic-uncovered16.txt
      - name: Upload exact transcript
        uses: actions/upload-artifact@v4
        with:
          name: product-side-seven-semantic-uncovered16
          path: semantic-uncovered16.txt
          if-no-files-found: error

# Measurement only until the transcript is independently replayed and promoted.
