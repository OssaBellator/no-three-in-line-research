name: Installed operation registry 110

on:
  push:
    paths:
      - 'scripts/check_prime_power_installed_operation_registry_110.py'
      - 'scripts/check_prime_power_protected_conflict_batching_ancestry.py'
      - 'docs/485-prime-power-installed-operation-registry-110.md'
      - 'proofs/composite-modulus-theorem-index-live-continuation-51.md'
      - '.github/workflows/installed-operation-registry-110.yml'
  pull_request:
    paths:
      - 'scripts/check_prime_power_installed_operation_registry_110.py'
      - 'scripts/check_prime_power_protected_conflict_batching_ancestry.py'
      - 'docs/485-prime-power-installed-operation-registry-110.md'
      - 'proofs/composite-modulus-theorem-index-live-continuation-51.md'
      - '.github/workflows/installed-operation-registry-110.yml'

jobs:
  check:
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python scripts/check_prime_power_installed_operation_registry_110.py
