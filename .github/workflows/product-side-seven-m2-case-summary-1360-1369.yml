name: Product side-seven compact case summaries 1360 through 1369

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/product-side-seven-m2-case-summary-1360-1369.yml

permissions:
  contents: read

jobs:
  classify:
    name: case-${{ matrix.case }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        case: [1360, 1361, 1362, 1363, 1364, 1365, 1366, 1367, 1368, 1369]
    steps:
      - uses: actions/checkout@v4
      - name: Check durable trigger
        id: gate
        shell: bash
        run: |
          if grep -qx 'run-case-summary-1360-1369' .github/product-side-seven-m2-case-summary-1360-1369-trigger.txt; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Compile compact case classifier
        if: steps.gate.outputs.run == 'true'
        run: >-
          g++ -O3 -std=c++17
          scripts/measure_product_side_seven_single_case_all_selectors.cpp
          -o /tmp/measure-product-side-seven-case
      - name: Classify exact case
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -o pipefail
          /tmp/measure-product-side-seven-case "${{ matrix.case }}" 2 \
            | tee "side-seven-m2-case-${{ matrix.case }}.txt"
          grep -q '^FINAL .* PASS$' "side-seven-m2-case-${{ matrix.case }}.txt"
      - name: Upload compact transcript
        if: always() && steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: side-seven-m2-case-${{ matrix.case }}
          path: side-seven-m2-case-${{ matrix.case }}.txt
          if-no-files-found: error

# Durable registration: retain until the ten compact case summaries are promoted.
