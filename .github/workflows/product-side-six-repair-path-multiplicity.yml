name: Product side-six repair path multiplicity

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/product-side-six-repair-path-multiplicity.yml

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Check durable trigger
        id: gate
        shell: bash
        run: |
          if grep -qx 'run-side-six-repair-path-multiplicity' .github/product-side-six-repair-path-multiplicity-trigger.txt; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Measure exact path multiplicity
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -o pipefail
          python scripts/measure_product_side_six_repair_path_multiplicity.py \
            | tee product-side-six-repair-path-multiplicity.txt
          grep -q ' PASS$' product-side-six-repair-path-multiplicity.txt
      - name: Upload exact transcript
        if: always() && steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: product-side-six-repair-path-multiplicity
          path: product-side-six-repair-path-multiplicity.txt
          if-no-files-found: error

# Durable registration: retain until the exact transcript is promoted.
