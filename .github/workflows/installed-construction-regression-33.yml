name: Installed construction regression 33

on:
  push:
    branches: [research/all-n-composite-modulus]
    paths:
      - scripts/check_prime_power_*.py
      - scripts/run_prime_power_installed_construction_regression_33.py
      - docs/464-prime-power-installed-construction-regression-33.md
      - proofs/composite-modulus-theorem-index-live-continuation-30.md
      - .github/workflows/installed-construction-regression-33.yml
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m py_compile scripts/run_prime_power_installed_construction_regression_33.py
      - run: python scripts/run_prime_power_installed_construction_regression_33.py --static-only
      - run: python scripts/run_prime_power_installed_construction_regression_33.py
