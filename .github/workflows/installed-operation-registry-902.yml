name: Installed operation registry 902

on:
  push:
    paths:
      - 'scripts/check_prime_power_superlevel_budget_thin_auxiliary_ancestry.py'
      - 'scripts/check_prime_power_installed_operation_registry_902.py'
      - 'docs/543-prime-power-installed-operation-registry-902.md'
      - '.github/workflows/installed-operation-registry-902.yml'
  pull_request:
  workflow_dispatch:

jobs:
  registry:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python scripts/check_prime_power_installed_operation_registry_902.py
