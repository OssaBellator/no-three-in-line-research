name: Routing-change ancestry frontier

on:
  push:
    branches:
      - research/all-n-composite-modulus
    paths:
      - "scripts/check_prime_power_routing_change_context_ancestry.py"
      - "scripts/check_prime_power_routing_change_history_payment.py"
      - "docs/448-prime-power-routing-change-context-ancestry.md"
      - ".github/workflows/routing-change-ancestry-frontier.yml"
  pull_request:
    paths:
      - "scripts/check_prime_power_routing_change_context_ancestry.py"
      - "scripts/check_prime_power_routing_change_history_payment.py"
      - "docs/448-prime-power-routing-change-context-ancestry.md"
      - ".github/workflows/routing-change-ancestry-frontier.yml"

permissions:
  contents: read

jobs:
  routing-change-ancestry:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile routing ancestry checkers
        run: |
          python -m py_compile \
            scripts/check_prime_power_routing_change_context_ancestry.py \
            scripts/check_prime_power_routing_change_history_payment.py
      - name: Run routing-change context ancestry
        run: python scripts/check_prime_power_routing_change_context_ancestry.py
      - name: Run routing-change history payment
        run: python scripts/check_prime_power_routing_change_history_payment.py
