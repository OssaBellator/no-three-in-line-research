name: Forced certificate escape frontier

on:
  push:
    branches:
      - research/all-n-composite-modulus
    paths:
      - scripts/check_prime_power_forced_certificate_escape_ancestry.py
      - docs/451-prime-power-forced-certificate-escape-ancestry.md
      - proofs/composite-modulus-theorem-index-live-continuation-17.md
      - .github/workflows/forced-certificate-escape-frontier.yml
  pull_request:
    paths:
      - scripts/check_prime_power_forced_certificate_escape_ancestry.py
      - docs/451-prime-power-forced-certificate-escape-ancestry.md
      - proofs/composite-modulus-theorem-index-live-continuation-17.md
      - .github/workflows/forced-certificate-escape-frontier.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile construction frontier checkers
        run: |
          python -m py_compile \
            scripts/check_prime_power_mixed_child_deletion_ancestry.py \
            scripts/check_prime_power_forced_certificate_escape_ancestry.py
      - name: Run mixed-child deletion ancestry
        run: python scripts/check_prime_power_mixed_child_deletion_ancestry.py
      - name: Run forced-certificate escape ancestry
        run: python scripts/check_prime_power_forced_certificate_escape_ancestry.py
