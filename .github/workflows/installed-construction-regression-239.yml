name: Installed construction regression 239

on:
  push:
    paths:
      - 'scripts/run_prime_power_installed_construction_regression_239.py'
      - 'scripts/check_prime_power_complete_branch_distinguishing_rank.py'
      - 'scripts/check_prime_power_installed_operation_registry_239.py'
      - 'docs/505-prime-power-installed-construction-regression-239.md'
      - '.github/workflows/installed-construction-regression-239.yml'
  pull_request:
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Static manifest audit
        run: python scripts/run_prime_power_installed_construction_regression_239.py --static-only
      - name: Run installed construction regression
        run: python scripts/run_prime_power_installed_construction_regression_239.py
