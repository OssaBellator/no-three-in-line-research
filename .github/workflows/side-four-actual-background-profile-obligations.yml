name: Side-four actual-background profile obligations

on:
  push:
    paths:
      - 'data/prime_power_side_four_selected_response_provenance_manifest.json'
      - 'data/prime_power_side_four_return_exchange_context_contract.json'
      - 'data/prime_power_side_four_residual_return_credit_worklist_contract.json'
      - 'data/prime_power_side_four_symbolic_line_kernel_context_contract.json'
      - 'data/prime_power_side_four_coefficient_dependency_line_refinement.json'
      - 'data/prime_power_side_four_actual_background_profile_obligation_contract.json'
      - 'scripts/check_prime_power_side_four_return_exchange_context.py'
      - 'scripts/check_prime_power_side_four_residual_return_credit_worklist.py'
      - 'scripts/check_prime_power_side_four_symbolic_line_kernel_context.py'
      - 'scripts/check_prime_power_side_four_coefficient_dependency_line_refinement.py'
      - 'scripts/check_prime_power_side_four_actual_background_profile_obligations.py'
      - 'docs/560-prime-power-side-four-symbolic-line-kernel-context.md'
      - 'docs/561-prime-power-side-four-line-dependency-refinement.md'
      - 'docs/562-prime-power-side-four-actual-background-profile-obligations.md'
      - '.github/workflows/side-four-actual-background-profile-obligations.yml'
  pull_request:
  workflow_dispatch:

jobs:
  background-profile:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python scripts/check_prime_power_side_four_return_exchange_context.py
      - run: python scripts/check_prime_power_side_four_residual_return_credit_worklist.py
      - run: python scripts/check_prime_power_side_four_symbolic_line_kernel_context.py
      - run: python scripts/check_prime_power_side_four_coefficient_dependency_line_refinement.py
      - run: python scripts/check_prime_power_side_four_actual_background_profile_obligations.py
