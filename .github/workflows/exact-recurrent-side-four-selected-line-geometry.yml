name: Exact recurrent side-four selected line geometry

on:
  push:
    branches:
      - research/exact-recurrent-lyapunov-audit
    paths:
      - data/exact_recurrent_side_four_selected_provenance_projection.json
      - data/exact_recurrent_side_four_selected_line_geometry.json
      - scripts/check_exact_recurrent_side_four_selected_line_geometry.py
      - .github/workflows/exact-recurrent-side-four-selected-line-geometry.yml
  pull_request:
    paths:
      - data/exact_recurrent_side_four_selected_provenance_projection.json
      - data/exact_recurrent_side_four_selected_line_geometry.json
      - scripts/check_exact_recurrent_side_four_selected_line_geometry.py
      - .github/workflows/exact-recurrent-side-four-selected-line-geometry.yml

jobs:
  audit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: |
          python -m py_compile scripts/check_exact_recurrent_side_four_selected_line_geometry.py
          python scripts/check_exact_recurrent_side_four_selected_line_geometry.py \
            --selected-projection data/exact_recurrent_side_four_selected_provenance_projection.json \
            --geometry data/exact_recurrent_side_four_selected_line_geometry.json
