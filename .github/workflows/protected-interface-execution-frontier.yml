name: Protected interface execution frontier

on:
  push:
    paths:
      - 'scripts/check_prime_power_protected_interface_execution_ancestry.py'
      - 'docs/490-prime-power-protected-interface-execution-ancestry.md'
      - 'proofs/composite-modulus-theorem-index-live-continuation-56.md'
      - '.github/workflows/protected-interface-execution-frontier.yml'
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python scripts/check_prime_power_protected_interface_execution_ancestry.py
