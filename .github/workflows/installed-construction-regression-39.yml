name: installed-construction-regression-39

on:
  push:
    branches: [research/all-n-composite-modulus]
    paths:
      - scripts/run_prime_power_installed_construction_regression_39.py
      - scripts/check_prime_power_rollback_level_colour_cycle_ancestry.py
      - scripts/check_prime_power_installed_operation_registry_39.py
      - docs/467-prime-power-installed-construction-regression-39.md
      - proofs/composite-modulus-theorem-index-live-continuation-33.md
      - .github/workflows/installed-construction-regression-39.yml
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python scripts/run_prime_power_installed_construction_regression_39.py
