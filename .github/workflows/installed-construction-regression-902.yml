name: Installed construction regression 902

on:
  push:
    paths:
      - 'scripts/run_prime_power_installed_construction_regression_902.py'
      - 'scripts/check_prime_power_superlevel_budget_thin_auxiliary_ancestry.py'
      - 'scripts/check_prime_power_installed_operation_registry_902.py'
      - 'docs/544-prime-power-installed-construction-regression-902.md'
      - '.github/workflows/installed-construction-regression-902.yml'
  pull_request:
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python scripts/run_prime_power_installed_construction_regression_902.py --static-only
      - run: python scripts/run_prime_power_installed_construction_regression_902.py
