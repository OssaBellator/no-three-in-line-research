name: Installed construction regression 138

on:
  push:
    paths:
      - 'scripts/run_prime_power_installed_construction_regression_138.py'
      - 'scripts/check_prime_power_protected_interface_execution_ancestry.py'
      - 'scripts/check_prime_power_installed_operation_registry_138.py'
      - 'docs/494-prime-power-installed-construction-regression-138.md'
      - 'proofs/composite-modulus-theorem-index-live-continuation-60.md'
      - '.github/workflows/installed-construction-regression-138.yml'
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python scripts/run_prime_power_installed_construction_regression_138.py
