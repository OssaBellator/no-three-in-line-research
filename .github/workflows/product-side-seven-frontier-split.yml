name: Product side-seven frontier split rescue

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/product-side-seven-frontier-split.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  measure-block:
    name: measure-${{ matrix.first_case }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        first_case:
          - 3000
          - 3010
          - 3020
          - 3030
          - 3040
          - 3050
          - 3060
          - 3070
          - 3080
          - 3090
          - 3100
          - 3110
          - 3120
          - 3130
          - 3140
          - 3150
          - 3160
          - 3170
          - 3180
          - 3190
    steps:
      - uses: actions/checkout@v4
      - name: Compile exact measurement tool
        run: >-
          g++ -O3 -std=c++17
          scripts/measure_product_side_seven_tier_shard.cpp
          -o /tmp/measure_product_side_seven_tier_shard
      - name: Measure ten exact cases
        run: >-
          /tmp/measure_product_side_seven_tier_shard
          "${{ matrix.first_case }}" 10 3
          | tee "product-side-seven-block-${{ matrix.first_case }}.txt"
      - name: Upload transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-side-seven-block-${{ matrix.first_case }}
          path: product-side-seven-block-${{ matrix.first_case }}.txt
          if-no-files-found: warn
