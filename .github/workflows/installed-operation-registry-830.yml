name: Installed operation registry 830

on:
  push:
    paths:
      - 'scripts/check_prime_power_recurrent_certificate_assembly_ancestry.py'
      - 'scripts/check_prime_power_installed_operation_registry_830.py'
      - 'docs/540-prime-power-installed-operation-registry-830.md'
      - '.github/workflows/installed-operation-registry-830.yml'
  pull_request:
  workflow_dispatch:

jobs:
  registry:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run installed operation registry 830
        run: python scripts/check_prime_power_installed_operation_registry_830.py
