name: Product side-seven multiplicity-two repeated semantic cover cores

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/product-side-seven-m2-semantic-cover-common-mask.yml

permissions:
  contents: read

jobs:
  measure:
    name: semantic-top-${{ matrix.top_index }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        top_index: [0, 1, 6, 7, 9, 50, 51, 56, 57, 60, 61, 63]
    steps:
      - uses: actions/checkout@v4
      - name: Check durable trigger
        id: gate
        shell: bash
        run: |
          if grep -qx 'run-semantic-common-mask' .github/product-side-seven-m2-semantic-common-mask-trigger.txt; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Compile semantic minimizer
        if: steps.gate.outputs.run == 'true'
        run: >-
          g++ -O3 -std=c++17
          scripts/measure_product_side_seven_multiplicity2_case0_orientation3_semantic_cover_core_index.cpp
          -o /tmp/measure-semantic-common-mask
      - name: Measure semantic cover core
        if: steps.gate.outputs.run == 'true'
        run: >-
          /tmp/measure-semantic-common-mask "${{ matrix.top_index }}"
          | tee "product-side-seven-m2-semantic-common-mask-${{ matrix.top_index }}.txt"
      - name: Upload exact transcript
        if: always() && steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: product-side-seven-m2-semantic-common-mask-${{ matrix.top_index }}
          path: product-side-seven-m2-semantic-common-mask-${{ matrix.top_index }}.txt
          if-no-files-found: warn
