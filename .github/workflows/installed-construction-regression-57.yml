name: installed-construction-regression-57

on:
  push:
    branches: [research/all-n-composite-modulus]
    paths:
      - scripts/run_prime_power_installed_construction_regression_57.py
      - scripts/check_prime_power_rooted_star_compatible_pair_line_clean.py
      - scripts/check_prime_power_line_clean_rollback_weighted_availability.py
      - scripts/check_prime_power_installed_operation_registry_57.py
      - docs/474-prime-power-installed-construction-regression-57.md
      - proofs/composite-modulus-theorem-index-live-continuation-40.md
      - .github/workflows/installed-construction-regression-57.yml
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python scripts/run_prime_power_installed_construction_regression_57.py
