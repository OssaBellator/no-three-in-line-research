name: Product side-seven relaxed 192-reference semantic vocabulary

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/product-side-seven-m2-semantic-full192.yml

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Check durable trigger
        id: gate
        shell: bash
        run: |
          if grep -qx 'run-semantic-full192' .github/product-side-seven-m2-semantic-full192-trigger.txt; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Compile exact vocabulary measurement
        if: steps.gate.outputs.run == 'true'
        run: >-
          g++ -O3 -std=c++17
          scripts/measure_product_side_seven_multiplicity2_case0_orientation3_semantic_vocabulary_full192_relaxed.cpp
          -o /tmp/measure-semantic-full192
      - name: Measure compact exact summary
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -o pipefail
          /tmp/measure-semantic-full192 \
            | grep '^FINAL ' \
            | tee product-side-seven-m2-semantic-full192.txt
      - name: Upload exact transcript
        if: always() && steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: product-side-seven-m2-semantic-full192
          path: product-side-seven-m2-semantic-full192.txt
          if-no-files-found: error

# Durable registration: corrected baseline assertions; retain until the exact compact transcript is promoted.
