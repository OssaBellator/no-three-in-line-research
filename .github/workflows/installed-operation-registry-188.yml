name: Installed operation registry 188

on:
  push:
    paths:
      - 'scripts/check_prime_power_installed_operation_registry_188.py'
      - 'scripts/product_factor_child_registry_entries_a.py'
      - 'scripts/product_factor_child_registry_entries_b.py'
      - 'docs/496-prime-power-installed-operation-registry-188.md'
      - '.github/workflows/installed-operation-registry-188.yml'
  pull_request:
  workflow_dispatch:

jobs:
  registry:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile registry modules
        run: |
          python -m py_compile \
            scripts/product_factor_child_registry_entries_a.py \
            scripts/product_factor_child_registry_entries_b.py \
            scripts/check_prime_power_installed_operation_registry_188.py
      - name: Run installed registry
        run: python scripts/check_prime_power_installed_operation_registry_188.py
