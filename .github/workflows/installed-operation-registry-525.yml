name: Installed operation registry 525

on:
  push:
    paths:
      - 'scripts/check_prime_power_installed_operation_registry_525.py'
      - 'scripts/check_prime_power_collateral_spectral_ancestry.py'
      - 'docs/522-prime-power-installed-operation-registry-525.md'
      - '.github/workflows/installed-operation-registry-525.yml'
  pull_request:
  workflow_dispatch:

jobs:
  registry:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run installed operation registry
        run: python scripts/check_prime_power_installed_operation_registry_525.py
