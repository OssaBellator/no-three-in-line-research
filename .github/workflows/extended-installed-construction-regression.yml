name: Extended installed construction regression

on:
  push:
    branches: [research/all-n-composite-modulus]
    paths:
      - scripts/check_prime_power_*.py
      - scripts/run_prime_power_extended_installed_construction_regression.py
      - docs/461-prime-power-extended-installed-construction-regression.md
      - proofs/composite-modulus-theorem-index-live-continuation-27.md
      - .github/workflows/extended-installed-construction-regression.yml
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m py_compile scripts/run_prime_power_extended_installed_construction_regression.py
      - run: python scripts/run_prime_power_extended_installed_construction_regression.py --static-only
      - run: python scripts/run_prime_power_extended_installed_construction_regression.py
