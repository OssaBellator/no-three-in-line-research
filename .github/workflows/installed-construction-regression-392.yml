name: Installed construction regression 392

on:
  push:
    paths:
      - 'scripts/run_prime_power_installed_construction_regression_392.py'
      - 'scripts/check_prime_power_protected_surplus_target_packing_ancestry.py'
      - 'scripts/check_prime_power_installed_operation_registry_392.py'
      - 'scripts/protected_surplus_registry_entries_a.py'
      - 'scripts/protected_surplus_registry_entries_b.py'
      - 'docs/514-prime-power-installed-construction-regression-392.md'
      - '.github/workflows/installed-construction-regression-392.yml'
  pull_request:
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Static manifest audit
        run: python scripts/run_prime_power_installed_construction_regression_392.py --static-only
      - name: Run installed construction regression
        run: python scripts/run_prime_power_installed_construction_regression_392.py
