name: rollback-level-colour-cycle-frontier

on:
  push:
    branches: [research/all-n-composite-modulus]
    paths:
      - scripts/check_prime_power_rollback_level_colour_cycle_ancestry.py
      - docs/465-prime-power-rollback-level-colour-cycle-ancestry.md
      - proofs/composite-modulus-theorem-index-live-continuation-31.md
      - .github/workflows/rollback-level-colour-cycle-frontier.yml
  workflow_dispatch:

jobs:
  finite-check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python scripts/check_prime_power_rollback_level_colour_cycle_ancestry.py
