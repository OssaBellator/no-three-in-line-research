name: installed-construction-regression-66

on:
  push:
    branches: [research/all-n-composite-modulus]
    paths:
      - scripts/run_prime_power_installed_construction_regression_66.py
      - scripts/check_prime_power_adaptive_unavailable_token_temporal_ancestry.py
      - scripts/check_prime_power_installed_operation_registry_66.py
      - docs/477-prime-power-installed-construction-regression-66.md
      - proofs/composite-modulus-theorem-index-live-continuation-43.md
      - .github/workflows/installed-construction-regression-66.yml
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python scripts/run_prime_power_installed_construction_regression_66.py
