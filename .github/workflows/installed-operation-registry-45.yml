name: installed-operation-registry-45

on:
  push:
    branches: [research/all-n-composite-modulus]
    paths:
      - scripts/check_prime_power_installed_operation_registry_45.py
      - docs/469-prime-power-installed-operation-registry-45.md
      - proofs/composite-modulus-theorem-index-live-continuation-35.md
      - .github/workflows/installed-operation-registry-45.yml
  workflow_dispatch:

jobs:
  registry:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python scripts/check_prime_power_installed_operation_registry_45.py
