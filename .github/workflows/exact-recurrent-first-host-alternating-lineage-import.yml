name: Exact recurrent first-host alternating lineage import

on:
  push:
    branches:
      - research/exact-recurrent-lyapunov-audit
  pull_request:
    paths:
      - data/exact_recurrent_first_host_background_signature.json
      - data/exact_recurrent_first_host_forbidden_background_invariance.json
      - data/exact_recurrent_first_host_physical_source_coverage.json
      - data/exact_recurrent_first_host_alternating_lineage_import.json
      - data/exact_recurrent_first_host_side_four_arithmetic_profile_import.json
      - data/exact_recurrent_first_host_safe_signature_quotient.json
      - data/exact_recurrent_first_host_safe_signature_symmetry.json
      - data/exact_recurrent_first_host_restoration_menu_closure.json
      - data/exact_recurrent_first_host_restoration_selector_face.json
      - data/exact_recurrent_first_host_selector_boolean_boundary.json
      - data/exact_recurrent_first_host_scalar_route_cover.json
      - data/exact_recurrent_first_host_menu_interaction_potential.json
      - data/exact_recurrent_first_host_alternating_route_budget_import.json
      - data/exact_recurrent_first_host_closure_route_source_gate.json
      - data/exact_recurrent_first_host_route_cover_admission.json
      - data/exact_recurrent_first_host_transition_domain_source_audit.json
      - data/exact_recurrent_first_host_state_exclusion_route_leverage.json
      - data/exact_recurrent_first_host_action_family_route_leverage.json
      - scripts/check_exact_recurrent_first_host_background_signature.py
      - scripts/check_exact_recurrent_first_host_alternating_lineage_import.py
      - scripts/check_exact_recurrent_first_host_side_four_arithmetic_profile_import.py
      - scripts/check_exact_recurrent_first_host_safe_signature_quotient.py
      - scripts/check_exact_recurrent_first_host_safe_signature_symmetry.py
      - scripts/check_exact_recurrent_first_host_restoration_menu_closure.py
      - scripts/check_exact_recurrent_first_host_restoration_selector_face.py
      - scripts/check_exact_recurrent_first_host_selector_boolean_boundary.py
      - scripts/check_exact_recurrent_first_host_scalar_route_cover.py
      - scripts/check_exact_recurrent_first_host_menu_interaction_potential.py
      - scripts/check_exact_recurrent_first_host_alternating_route_budget_import.py
      - scripts/check_exact_recurrent_first_host_closure_route_source_gate.py
      - scripts/check_exact_recurrent_first_host_route_cover_admission.py
      - scripts/check_exact_recurrent_first_host_transition_domain_source_audit.py
      - scripts/check_exact_recurrent_first_host_state_exclusion_route_leverage.py
      - scripts/check_exact_recurrent_first_host_action_family_route_leverage.py
      - docs/exact-recurrent-first-host-alternating-lineage-import.md
      - docs/exact-recurrent-first-host-side-four-arithmetic-profile-import.md
      - docs/exact-recurrent-first-host-safe-signature-quotient.md
      - docs/exact-recurrent-first-host-safe-signature-symmetry.md
      - docs/exact-recurrent-first-host-restoration-menu-closure.md
      - docs/exact-recurrent-first-host-restoration-selector-face.md
      - docs/exact-recurrent-first-host-selector-boolean-boundary.md
      - docs/exact-recurrent-first-host-scalar-route-cover.md
      - docs/exact-recurrent-first-host-menu-interaction-potential.md
      - docs/exact-recurrent-first-host-alternating-route-budget-import.md
      - docs/exact-recurrent-first-host-closure-route-source-gate.md
      - docs/exact-recurrent-first-host-route-cover-admission.md
      - docs/exact-recurrent-first-host-transition-domain-source-audit.md
      - docs/exact-recurrent-first-host-state-exclusion-route-leverage.md
      - docs/exact-recurrent-first-host-action-family-route-leverage.md
      - .github/workflows/exact-recurrent-first-host-alternating-lineage-import.yml
  workflow_dispatch:

jobs:
  exact-audit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check alternating-core lineage import
        run: |
          python scripts/check_exact_recurrent_first_host_alternating_lineage_import.py \
            --check data/exact_recurrent_first_host_alternating_lineage_import.json
      - name: Check exact side-four arithmetic profile import
        run: |
          python scripts/check_exact_recurrent_first_host_side_four_arithmetic_profile_import.py \
            --check data/exact_recurrent_first_host_side_four_arithmetic_profile_import.json
      - name: Check exact safe signature quotient
        run: |
          python scripts/check_exact_recurrent_first_host_safe_signature_quotient.py \
            --check data/exact_recurrent_first_host_safe_signature_quotient.json
      - name: Check exact safe signature symmetry
        run: |
          python scripts/check_exact_recurrent_first_host_safe_signature_symmetry.py \
            --check data/exact_recurrent_first_host_safe_signature_symmetry.json
      - name: Check restoration menu closure
        run: |
          python scripts/check_exact_recurrent_first_host_restoration_menu_closure.py \
            --check data/exact_recurrent_first_host_restoration_menu_closure.json
      - name: Check restoration selector faces
        run: |
          python scripts/check_exact_recurrent_first_host_restoration_selector_face.py \
            --check data/exact_recurrent_first_host_restoration_selector_face.json
      - name: Check selector Boolean boundary gates
        run: |
          python scripts/check_exact_recurrent_first_host_selector_boolean_boundary.py \
            --check data/exact_recurrent_first_host_selector_boolean_boundary.json
      - name: Check scalar route-cover classification
        run: |
          python scripts/check_exact_recurrent_first_host_scalar_route_cover.py \
            --check data/exact_recurrent_first_host_scalar_route_cover.json
      - name: Check menu interaction potentials
        run: |
          python scripts/check_exact_recurrent_first_host_menu_interaction_potential.py \
            --check data/exact_recurrent_first_host_menu_interaction_potential.json
      - name: Check alternating route budget import
        run: |
          python scripts/check_exact_recurrent_first_host_alternating_route_budget_import.py \
            --check data/exact_recurrent_first_host_alternating_route_budget_import.json
      - name: Check closure route source gate
        run: |
          python scripts/check_exact_recurrent_first_host_closure_route_source_gate.py \
            --check data/exact_recurrent_first_host_closure_route_source_gate.json
      - name: Check route-cover admission
        run: |
          python scripts/check_exact_recurrent_first_host_route_cover_admission.py \
            --check data/exact_recurrent_first_host_route_cover_admission.json
      - name: Check transition-domain source audit
        run: |
          python scripts/check_exact_recurrent_first_host_transition_domain_source_audit.py \
            --check data/exact_recurrent_first_host_transition_domain_source_audit.json
      - name: Check state-exclusion route leverage
        run: |
          python scripts/check_exact_recurrent_first_host_state_exclusion_route_leverage.py \
            --check data/exact_recurrent_first_host_state_exclusion_route_leverage.json
      - name: Check action-family route leverage
        run: |
          python scripts/check_exact_recurrent_first_host_action_family_route_leverage.py \
            --check data/exact_recurrent_first_host_action_family_route_leverage.json
