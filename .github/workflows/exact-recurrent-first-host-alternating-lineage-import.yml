jobs:
  exact-audit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check alternating-core lineage import
        run: |
          python scripts/check_exact_recurrent_first_host_alternating_lineage_import.py \
            --check data/exact_recurrent_first_host_alternating_lineage_import.json
      - name: Check exact side-four arithmetic profile import
        run: |
          python scripts/check_exact_recurrent_first_host_side_four_arithmetic_profile_import.py \
            --check data/exact_recurrent_first_host_side_four_arithmetic_profile_import.json
      - name: Check exact safe signature quotient
        run: |
          python scripts/check_exact_recurrent_first_host_safe_signature_quotient.py \
            --check data/exact_recurrent_first_host_safe_signature_quotient.json
      - name: Check exact safe signature symmetry
        run: |
          python scripts/check_exact_recurrent_first_host_safe_signature_symmetry.py \
            --check data/exact_recurrent_first_host_safe_signature_symmetry.json
      - name: Check restoration menu closure
        run: |
          python scripts/check_exact_recurrent_first_host_restoration_menu_closure.py \
            --check data/exact_recurrent_first_host_restoration_menu_closure.json
      - name: Check restoration selector faces
        run: |
          python scripts/check_exact_recurrent_first_host_restoration_selector_face.py \
            --check data/exact_recurrent_first_host_restoration_selector_face.json
      - name: Check selector-rule compatibility
        run: |
          python scripts/check_exact_recurrent_first_host_selector_rule_compatibility.py \
            --check data/exact_recurrent_first_host_selector_rule_compatibility.json
      - name: Check selector-face congruence worklist
        run: |
          python scripts/check_exact_recurrent_first_host_selector_face_congruence_worklist.py \
            --check data/exact_recurrent_first_host_selector_face_congruence_worklist.json
      - name: Check selector-face source import gate
        run: |
          python scripts/check_exact_recurrent_first_host_selector_face_source_import_gate.py \
            --check data/exact_recurrent_first_host_selector_face_source_import_gate.json
      - name: Check selector-face closure leverage
        run: |
          python scripts/check_exact_recurrent_first_host_selector_face_closure_leverage.py \
            --check data/exact_recurrent_first_host_selector_face_closure_leverage.json
      - name: Check minimizer-face scalar route covers
        run: |
          python scripts/check_exact_recurrent_first_host_minimizer_face_scalar_route_cover.py \
            --check data/exact_recurrent_first_host_minimizer_face_scalar_route_cover.json
      - name: Check minimizer-face cost dominance
        run: |
          python scripts/check_exact_recurrent_first_host_minimizer_face_cost_dominance.py \
            --check data/exact_recurrent_first_host_minimizer_face_cost_dominance.json \
            --self-test
      - name: Check selector Boolean boundary gates
        run: |
          python scripts/check_exact_recurrent_first_host_selector_boolean_boundary.py \
            --check data/exact_recurrent_first_host_selector_boolean_boundary.json
      - name: Check scalar route-cover classification
        run: |
          python scripts/check_exact_recurrent_first_host_scalar_route_cover.py \
            --check data/exact_recurrent_first_host_scalar_route_cover.json
      - name: Check menu interaction potentials
        run: |
          python scripts/check_exact_recurrent_first_host_menu_interaction_potential.py \
            --check data/exact_recurrent_first_host_menu_interaction_potential.json
      - name: Check alternating route budget import
        run: |
          python scripts/check_exact_recurrent_first_host_alternating_route_budget_import.py \
            --check data/exact_recurrent_first_host_alternating_route_budget_import.json
      - name: Check closure route source gate
        run: |
          python scripts/check_exact_recurrent_first_host_closure_route_source_gate.py \
            --check data/exact_recurrent_first_host_closure_route_source_gate.json
      - name: Check route-cover admission
        run: |
          python scripts/check_exact_recurrent_first_host_route_cover_admission.py \
            --check data/exact_recurrent_first_host_route_cover_admission.json
      - name: Check transition-domain source audit
        run: |
          python scripts/check_exact_recurrent_first_host_transition_domain_source_audit.py \
            --check data/exact_recurrent_first_host_transition_domain_source_audit.json
      - name: Check state-exclusion route leverage
        run: |
          python scripts/check_exact_recurrent_first_host_state_exclusion_route_leverage.py \
            --check data/exact_recurrent_first_host_state_exclusion_route_leverage.json
      - name: Check action-family route leverage
        run: |
          python scripts/check_exact_recurrent_first_host_action_family_route_leverage.py \
            --check data/exact_recurrent_first_host_action_family_route_leverage.json
      - name: Check action-family congruence obstruction
        run: |
          python scripts/check_exact_recurrent_first_host_action_family_congruence_obstruction.py \
            --check data/exact_recurrent_first_host_action_family_congruence_obstruction.json
      - name: Check action-family source import gate
        run: |
          python scripts/check_exact_recurrent_first_host_action_family_source_import_gate.py \
            --check data/exact_recurrent_first_host_action_family_source_import_gate.json
      - name: Check mixed source-certificate leverage
        run: |
          python scripts/check_exact_recurrent_first_host_mixed_source_certificate_leverage.py \
            --check data/exact_recurrent_first_host_mixed_source_certificate_leverage.json \
            --self-test
      - name: Check hybrid source-certificate antichain
        run: |
          python scripts/check_exact_recurrent_first_host_hybrid_source_certificate_antichain.py \
            --check data/exact_recurrent_first_host_hybrid_source_certificate_antichain.json \
            --self-test
      - name: Check evidence-scope overlap obstruction
        run: |
          python scripts/check_exact_recurrent_first_host_evidence_scope_overlap_obstruction.py \
            --check data/exact_recurrent_first_host_evidence_scope_overlap_obstruction.json \
            --self-test
