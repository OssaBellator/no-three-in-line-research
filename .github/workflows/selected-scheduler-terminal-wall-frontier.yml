name: Selected scheduler terminal wall frontier

on:
  push:
    paths:
      - 'scripts/check_prime_power_selected_scheduler_terminal_wall_ancestry.py'
      - 'docs/241-prime-power-minimum-selected-routing-normalization.md'
      - 'docs/242-prime-power-minimum-loss-normalization.md'
      - 'docs/243-prime-power-fixed-core-reopening-normalization.md'
      - 'docs/244-prime-power-target-bank-rollback-support.md'
      - 'docs/245-prime-power-rollback-blocker-cover-normalization.md'
      - 'docs/246-prime-power-selected-scheduler-finite-response.md'
      - 'docs/247-prime-power-terminal-blocker-hall-wall.md'
      - 'docs/248-prime-power-minimal-blocker-unit-wall.md'
      - 'docs/249-prime-power-terminal-certificate-bank-descent.md'
      - 'docs/515-prime-power-selected-scheduler-terminal-wall-ancestry.md'
      - '.github/workflows/selected-scheduler-terminal-wall-frontier.yml'
  pull_request:
  workflow_dispatch:

jobs:
  checker:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run selected scheduler terminal wall checker
        run: python scripts/check_prime_power_selected_scheduler_terminal_wall_ancestry.py
