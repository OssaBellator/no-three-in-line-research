name: Product side-seven case 1287 selector one

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/product-side-seven-case1287-selector1.yml

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Check durable trigger
        id: gate
        shell: bash
        run: |
          if grep -qx 'run-case1287-selector1' .github/product-side-seven-case1287-selector1-trigger.txt; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Compile independent selector tool
        if: steps.gate.outputs.run == 'true'
        run: >-
          g++ -O3 -std=c++17
          scripts/measure_product_side_seven_case1287_selector1.cpp
          -o /tmp/measure-case1287-selector1
      - name: Measure exact selector result
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -o pipefail
          /tmp/measure-case1287-selector1 \
            | tee product-side-seven-case1287-selector1.txt
          grep -q ' INFEASIBLE$' product-side-seven-case1287-selector1.txt
      - name: Upload exact transcript
        if: always() && steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: product-side-seven-case1287-selector1
          path: product-side-seven-case1287-selector1.txt
          if-no-files-found: error

# Durable registration: retain until selector one is promoted.
