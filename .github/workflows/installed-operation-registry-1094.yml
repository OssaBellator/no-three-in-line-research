name: Installed operation registry 1094

on:
  push:
    paths:
      - 'scripts/check_prime_power_labelled_moment_slack_assignment_ancestry.py'
      - 'scripts/check_prime_power_installed_operation_registry_1094.py'
      - 'docs/552-prime-power-installed-operation-registry-1094.md'
      - '.github/workflows/installed-operation-registry-1094.yml'
  pull_request:
  workflow_dispatch:

jobs:
  registry:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python scripts/check_prime_power_installed_operation_registry_1094.py
