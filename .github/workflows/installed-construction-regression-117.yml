name: Installed construction regression 117

on:
  push:
    paths:
      - 'scripts/run_prime_power_installed_construction_regression_117.py'
      - 'scripts/check_prime_power_selector_protected_certificate_ancestry.py'
      - 'scripts/check_prime_power_installed_operation_registry_117.py'
      - 'docs/489-prime-power-installed-construction-regression-117.md'
      - 'proofs/composite-modulus-theorem-index-live-continuation-55.md'
      - '.github/workflows/installed-construction-regression-117.yml'
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python scripts/run_prime_power_installed_construction_regression_117.py
