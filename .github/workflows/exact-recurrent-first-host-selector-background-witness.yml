name: Exact recurrent first-host selector background witness

on:
  push:
    branches:
      - research/exact-recurrent-lyapunov-audit
    paths:
      - data/exact_recurrent_first_host_selector_background_witness.json
      - scripts/check_exact_recurrent_first_host_selector_background_witness.py
      - .github/workflows/exact-recurrent-first-host-selector-background-witness.yml
  pull_request:
    paths:
      - data/exact_recurrent_first_host_selector_background_witness.json
      - scripts/check_exact_recurrent_first_host_selector_background_witness.py
      - .github/workflows/exact-recurrent-first-host-selector-background-witness.yml

jobs:
  audit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: |
          python -m py_compile scripts/check_exact_recurrent_first_host_selector_background_witness.py
          python scripts/check_exact_recurrent_first_host_selector_background_witness.py \
            --witness data/exact_recurrent_first_host_selector_background_witness.json
