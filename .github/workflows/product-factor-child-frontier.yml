name: Product factor child frontier

on:
  push:
    paths:
      - 'scripts/check_prime_power_product_factor_child_ancestry.py'
      - 'scripts/product_factor_child_common.py'
      - 'scripts/product_factor_child_product.py'
      - 'scripts/product_factor_child_routing.py'
      - 'docs/495-prime-power-product-factor-child-ancestry.md'
      - '.github/workflows/product-factor-child-frontier.yml'
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile product-factor modules
        run: |
          python -m py_compile \
            scripts/product_factor_child_common.py \
            scripts/product_factor_child_product.py \
            scripts/product_factor_child_routing.py \
            scripts/check_prime_power_product_factor_child_ancestry.py
      - name: Run product-factor child checker
        run: python scripts/check_prime_power_product_factor_child_ancestry.py
