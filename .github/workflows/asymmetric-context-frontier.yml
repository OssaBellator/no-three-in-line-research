name: Asymmetric context frontier

on:
  push:
    branches:
      - research/all-n-composite-modulus
    paths:
      - "scripts/check_prime_power_masked_host_parent_generation.py"
      - "scripts/check_prime_power_required_prefix_parent_generation.py"
      - "scripts/check_prime_power_asymmetric_residual_host_contraction.py"
      - "scripts/check_prime_power_asymmetric_context_generation.py"
      - "docs/444-prime-power-asymmetric-residual-host-contraction.md"
      - "docs/445-prime-power-asymmetric-context-generation-and-composition.md"
      - ".github/workflows/asymmetric-context-frontier.yml"
  pull_request:
    paths:
      - "scripts/check_prime_power_masked_host_parent_generation.py"
      - "scripts/check_prime_power_required_prefix_parent_generation.py"
      - "scripts/check_prime_power_asymmetric_residual_host_contraction.py"
      - "scripts/check_prime_power_asymmetric_context_generation.py"
      - "docs/444-prime-power-asymmetric-residual-host-contraction.md"
      - "docs/445-prime-power-asymmetric-context-generation-and-composition.md"
      - ".github/workflows/asymmetric-context-frontier.yml"

permissions:
  contents: read

jobs:
  asymmetric-context-checker:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile asymmetric context stack
        run: |
          python -m py_compile \
            scripts/check_prime_power_masked_host_parent_generation.py \
            scripts/check_prime_power_required_prefix_parent_generation.py \
            scripts/check_prime_power_asymmetric_residual_host_contraction.py \
            scripts/check_prime_power_asymmetric_context_generation.py
      - name: Run residual-host contraction checker
        run: python scripts/check_prime_power_asymmetric_residual_host_contraction.py
      - name: Run asymmetric context checker
        run: python scripts/check_prime_power_asymmetric_context_generation.py
