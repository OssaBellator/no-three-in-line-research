name: Exact recurrent first-host two-point original-face family

on:
  push:
    paths:
      - scripts/check_exact_recurrent_first_host_two_point_original_face_family.py
      - data/exact_recurrent_first_host_two_point_original_face_family.json
      - docs/exact-recurrent-first-host-two-point-original-face-family.md
      - .github/workflows/exact-recurrent-first-host-two-point-original-face-family.yml
  pull_request:
    paths:
      - scripts/check_exact_recurrent_first_host_two_point_original_face_family.py
      - data/exact_recurrent_first_host_two_point_original_face_family.json
      - docs/exact-recurrent-first-host-two-point-original-face-family.md
      - .github/workflows/exact-recurrent-first-host-two-point-original-face-family.yml

jobs:
  audit:
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: |
          python -m py_compile scripts/check_exact_recurrent_first_host_two_point_original_face_family.py
          python scripts/check_exact_recurrent_first_host_two_point_original_face_family.py \
            --check data/exact_recurrent_first_host_two_point_original_face_family.json \
            | tee /tmp/result.json
          python - <<'PY'
          import json
          result = json.loads(open('/tmp/result.json', encoding='utf-8').read())
          assert result['critical_pair_line_classification_complete'] == 1
          assert result['infinite_affine_schema_completion_family_proved'] == 1
          assert result['physical_background_realizability_proved'] == 0
          assert result['strict_lyapunov_certificate_proved'] == 0
          assert result['all_n_proved_by_checker'] == 0
          assert result['mutation_corruptions_rejected'] == 8
          PY
