name: Installed operation registry 552

on:
  push:
    paths:
      - 'scripts/check_prime_power_installed_operation_registry_552.py'
      - 'scripts/check_prime_power_finite_grid_response_ancestry.py'
      - 'docs/525-prime-power-installed-operation-registry-552.md'
      - '.github/workflows/installed-operation-registry-552.yml'
  pull_request:
  workflow_dispatch:

jobs:
  registry:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run installed operation registry
        run: python scripts/check_prime_power_installed_operation_registry_552.py
