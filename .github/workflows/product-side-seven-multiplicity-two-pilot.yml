name: Product side-seven multiplicity-two pilot

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/product-side-seven-multiplicity-two-pilot.yml

permissions:
  contents: read

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Compile exact shard tool
        run: >-
          g++ -O3 -std=c++17
          scripts/measure_product_side_seven_tier_shard.cpp
          -o /tmp/measure-product-side-seven-tier-shard
      - name: Measure multiplicity-two cases zero through nine
        run: >-
          /tmp/measure-product-side-seven-tier-shard 0 10 2
          | tee product-side-seven-multiplicity-two-pilot.txt
      - name: Upload transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-side-seven-multiplicity-two-pilot
          path: product-side-seven-multiplicity-two-pilot.txt
          if-no-files-found: warn
