name: Side-four joint sample global binding audit

on:
  push:
    paths:
      - 'data/prime_power_side_four_joint_sample_weight_compatibility_contract.json'
      - 'data/prime_power_side_four_joint_sample_global_binding_attempt_contract.json'
      - 'scripts/run_prime_power_installed_construction_regression_1166.py'
      - 'scripts/check_prime_power_labelled_moment_slack_assignment_ancestry.py'
      - 'scripts/check_label_weighted_assignment_certificate.py'
      - 'scripts/check_prime_power_installed_operation_registry_1166.py'
      - 'scripts/check_prime_power_side_four_joint_sample_global_binding_attempt.py'
      - 'docs/571-prime-power-side-four-joint-sample-global-binding-attempt.md'
      - '.github/workflows/side-four-joint-sample-global-binding-attempt.yml'
  pull_request:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python scripts/check_prime_power_side_four_joint_sample_weight_compatibility.py
      - run: python scripts/check_prime_power_side_four_joint_sample_global_binding_attempt.py
