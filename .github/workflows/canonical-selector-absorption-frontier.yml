name: Canonical selector absorption frontier

on:
  push:
    paths:
      - 'scripts/check_prime_power_canonical_selector_absorption_ancestry.py'
      - 'docs/481-prime-power-canonical-selector-absorption-ancestry.md'
      - 'proofs/composite-modulus-theorem-index-live-continuation-47.md'
      - '.github/workflows/canonical-selector-absorption-frontier.yml'
  pull_request:
    paths:
      - 'scripts/check_prime_power_canonical_selector_absorption_ancestry.py'
      - 'docs/481-prime-power-canonical-selector-absorption-ancestry.md'
      - 'proofs/composite-modulus-theorem-index-live-continuation-47.md'
      - '.github/workflows/canonical-selector-absorption-frontier.yml'

jobs:
  check:
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python scripts/check_prime_power_canonical_selector_absorption_ancestry.py
