name: Replay promoted all-n frontier intervals

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/product-promoted-frontier-replay.yml
      - .github/workflows/product-side-seven-frontier.yml
      - .github/workflows/product-side-ten-opposite-fine-6400-6799.yml
      - .github/product-side-seven-multiplicity-two-1430-1439-trigger.txt
      - .github/product-side-ten-opposite-fine-6400-6799-trigger.txt
      - AUTOPROMPTER_HANDOFF.md
      - STATUS.md
      - docs/367-side-seven-semantic-uncovered-top-expansion-16.md
      - docs/368-side-seven-multiplicity-two-cases-1400-through-1409.md
      - docs/369-side-ten-opposite-pair-fine-row-fourteenth-prefix.md
      - docs/370-side-seven-multiplicity-two-cases-1410-through-1419.md
      - docs/371-side-ten-opposite-pair-fine-row-fifteenth-prefix.md
      - docs/372-side-seven-multiplicity-two-cases-1420-through-1429.md
      - docs/373-side-ten-opposite-pair-fine-row-sixteenth-prefix.md
      - tracks/all-n-product-current-frontiers.md
      - tracks/all-n-product-frontier-manifest.json
      - scripts/measure_product_side_seven_single_case_all_selectors.cpp
      - scripts/search_product_transposition_double_coset_ten.cpp
      - scripts/verify_product_side_seven_multiplicity2_cases1390_1399.py
      - scripts/verify_product_side_seven_multiplicity2_cases1400_1409.py
      - scripts/verify_product_side_seven_multiplicity2_cases1410_1419.py
      - scripts/verify_product_side_seven_multiplicity2_cases1420_1429.py
      - scripts/verify_product_transposition_double_coset_opposite_fine_ten_4800_5199.py
      - scripts/verify_product_transposition_double_coset_opposite_fine_ten_5200_5599.py
      - scripts/verify_product_transposition_double_coset_opposite_fine_ten_5600_5999.py
      - scripts/verify_product_transposition_double_coset_opposite_fine_ten_6000_6399.py
      - scripts/measure_product_side_seven_multiplicity2_case0_orientation3_semantic_uncovered16.cpp
      - scripts/verify_product_side_seven_multiplicity2_case0_orientation3_semantic_uncovered16.py
      - scripts/verify_product_frontier_manifest.py
  workflow_dispatch:

concurrency:
  group: product-promoted-frontier-replay-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  side-seven-1390-1399-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/verify_product_side_seven_multiplicity2_cases1390_1399.py

  side-seven-1400-1409-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/verify_product_side_seven_multiplicity2_cases1400_1409.py

  side-seven-1410-1419-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/verify_product_side_seven_multiplicity2_cases1410_1419.py

  side-seven-1420-1429-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/verify_product_side_seven_multiplicity2_cases1420_1429.py

  side-ten-4800-5199-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/verify_product_transposition_double_coset_opposite_fine_ten_4800_5199.py

  side-ten-5200-5599-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/verify_product_transposition_double_coset_opposite_fine_ten_5200_5599.py

  side-ten-5600-5999-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/verify_product_transposition_double_coset_opposite_fine_ten_5600_5999.py

  side-ten-6000-6399-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/verify_product_transposition_double_coset_opposite_fine_ten_6000_6399.py

  semantic-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/verify_product_side_seven_multiplicity2_case0_orientation3_semantic_uncovered16.py

  frontier-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/verify_product_frontier_manifest.py
