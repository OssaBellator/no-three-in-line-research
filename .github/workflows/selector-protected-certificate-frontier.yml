name: Selector protected certificate frontier

on:
  push:
    paths:
      - 'scripts/check_prime_power_selector_protected_certificate_ancestry.py'
      - 'docs/487-prime-power-selector-protected-certificate-ancestry.md'
      - 'proofs/composite-modulus-theorem-index-live-continuation-53.md'
      - '.github/workflows/selector-protected-certificate-frontier.yml'
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python scripts/check_prime_power_selector_protected_certificate_ancestry.py
