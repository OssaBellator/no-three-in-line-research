name: Product side-seven semantic union complement through 192 references

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/product-side-seven-m2-semantic-complement192.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Check durable trigger
        id: gate
        shell: bash
        run: |
          if grep -qx 'run-semantic-complement192' .github/product-side-seven-m2-semantic-complement192-trigger.txt; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Compile exact complement verifier
        if: steps.gate.outputs.run == 'true'
        run: >-
          g++ -O3 -std=c++17
          scripts/verify_product_side_seven_multiplicity2_case0_orientation3_semantic_union_complement192.cpp
          -o /tmp/verify-semantic-complement192
      - name: Verify exact complement
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -o pipefail
          /tmp/verify-semantic-complement192 \
            | tee product-side-seven-m2-semantic-complement192.txt
          grep -q ' PASS$' product-side-seven-m2-semantic-complement192.txt
      - name: Upload exact transcript
        if: always() && steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: product-side-seven-m2-semantic-complement192
          path: product-side-seven-m2-semantic-complement192.txt
          if-no-files-found: error

# Durable registration: retain until the exact complement is promoted.
