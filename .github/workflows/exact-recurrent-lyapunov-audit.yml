name: Exact recurrent Lyapunov audit

on:
  push:
    paths:
      - 'tracks/exact-recurrent-lyapunov-audit.md'
      - 'docs/exact-recurrent-state-schema.md'
      - 'scripts/check_exact_recurrent_manifest.py'
      - 'experiments/exact-recurrent-manifest-example.json'
      - '.github/workflows/exact-recurrent-lyapunov-audit.yml'
  pull_request:
  workflow_dispatch:

jobs:
  exact-rational-checker:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile checker
        run: python -m py_compile scripts/check_exact_recurrent_manifest.py
      - name: Check built-in manifest and corruption audit
        run: python scripts/check_exact_recurrent_manifest.py
      - name: Check repository fixture
        run: >-
          python scripts/check_exact_recurrent_manifest.py
          experiments/exact-recurrent-manifest-example.json
