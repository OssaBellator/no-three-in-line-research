name: Product side-seven multiplicity-two cover case zero orientation three 64

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/product-side-seven-m2-cover-case0-o3-64.yml

permissions:
  contents: read

jobs:
  measure:
    name: cover-case0-o3-64
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Check durable trigger
        id: gate
        shell: bash
        run: |
          if grep -qx 'run-cover-case0-o3-64' .github/product-side-seven-m2-cover-o3-64-trigger.txt; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Compile exact cover tool
        if: steps.gate.outputs.run == 'true'
        run: >-
          g++ -O3 -std=c++17
          scripts/measure_product_side_seven_bottom_triple_cover.cpp
          -o /tmp/measure-product-side-seven-bottom-cover
      - name: Measure 64 top orders
        if: steps.gate.outputs.run == 'true'
        run: >-
          /tmp/measure-product-side-seven-bottom-cover
          2 0 3 64
          | tee product-side-seven-m2-cover-case0-o3-64.txt
      - name: Upload exact transcript
        if: always() && steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: product-side-seven-m2-cover-case0-o3-64
          path: product-side-seven-m2-cover-case0-o3-64.txt
          if-no-files-found: warn
