name: mixed-cycle-boundary-theta-frontier

on:
  push:
    branches: [research/all-n-composite-modulus]
    paths:
      - scripts/check_prime_power_mixed_cycle_boundary_theta_payment.py
      - docs/468-prime-power-mixed-cycle-boundary-theta-payment-ancestry.md
      - proofs/composite-modulus-theorem-index-live-continuation-34.md
      - .github/workflows/mixed-cycle-boundary-theta-frontier.yml
  workflow_dispatch:

jobs:
  finite-check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python scripts/check_prime_power_mixed_cycle_boundary_theta_payment.py
