name: Installed operation registry 239

on:
  push:
    paths:
      - 'scripts/check_prime_power_installed_operation_registry_239.py'
      - 'docs/504-prime-power-installed-operation-registry-239.md'
      - '.github/workflows/installed-operation-registry-239.yml'
  pull_request:
  workflow_dispatch:

jobs:
  registry:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile registry
        run: python -m py_compile scripts/check_prime_power_installed_operation_registry_239.py
      - name: Run registry
        run: python scripts/check_prime_power_installed_operation_registry_239.py
