name: Installed operation registry 608

on:
  push:
    paths:
      - 'scripts/check_prime_power_installed_operation_registry_608.py'
      - 'scripts/check_prime_power_inherited_coordinate_diagonal_block_ancestry.py'
      - 'docs/528-prime-power-installed-operation-registry-608.md'
      - '.github/workflows/installed-operation-registry-608.yml'
  pull_request:
  workflow_dispatch:

jobs:
  registry:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate installed operation registry 608
        run: python scripts/check_prime_power_installed_operation_registry_608.py
