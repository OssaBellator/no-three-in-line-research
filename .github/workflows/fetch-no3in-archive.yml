name: Verify recovered no-three certificates

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch archive files
        shell: bash
        run: |
          set -euo pipefail
          mkdir archive
          for n in 40 42 52; do
            url="https://wwwhomes.uni-bielefeld.de/~achim/no3in/download/configurations/n${n}_rot4"
            curl --fail --location --retry 5 --retry-all-errors --connect-timeout 30 --max-time 300 "$url" -o "archive/n${n}_rot4"
            test -s "archive/n${n}_rot4"
            sha256sum "archive/n${n}_rot4"
          done
      - name: Run certificate regressions
        shell: bash
        run: |
          set -euo pipefail
          python scripts/check_public_rot4_prime_certificates.py \
            experiments/public-rot4-prime-certificates-p41-p43-p53.json \
            --archive-dir archive
          python scripts/check_prime_minus_one_seed.py \
            experiments/prime-minus-one-seed-examples.json
          python scripts/check_prime_seed_relative_cycles.py \
            experiments/prime-seed-relative-cycle-example.json
          python scripts/check_archived_prime_seed_codes.py \
            experiments/archived-prime-seed-codes.json
          python scripts/check_quarter_turn_seed_normal_forms.py \
            experiments/archived-prime-seed-codes.json
          python scripts/check_swapped_quarter_turn_orbit_csp.py \
            experiments/archived-prime-seed-codes.json
