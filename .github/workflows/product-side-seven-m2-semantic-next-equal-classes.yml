name: Product side-seven next equal-support semantic cores

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/product-side-seven-m2-semantic-next-equal-classes.yml

permissions:
  contents: read

jobs:
  measure:
    name: semantic-next-equal-classes
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Check durable trigger
        id: gate
        shell: bash
        run: |
          if grep -qx 'run-semantic-next-equal-classes' .github/product-side-seven-m2-semantic-next-equal-classes-trigger.txt; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Compile generic semantic minimizer
        if: steps.gate.outputs.run == 'true'
        run: >-
          g++ -O3 -std=c++17
          scripts/measure_product_side_seven_multiplicity2_case0_orientation3_semantic_cover_core_any.cpp
          -o /tmp/measure-semantic-core-any
      - name: Measure repeated equal-support classes
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          : > product-side-seven-m2-semantic-next-equal-classes.txt
          for top in 3 5 8 10 11 32 33 36 37 38 39 40 41 49 52 55 58 62; do
            /tmp/measure-semantic-core-any "$top" \
              | tee -a product-side-seven-m2-semantic-next-equal-classes.txt
          done
      - name: Upload exact transcript
        if: always() && steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: product-side-seven-m2-semantic-next-equal-classes
          path: product-side-seven-m2-semantic-next-equal-classes.txt
          if-no-files-found: warn

# Durable registration: retain until the exact transcript is secured.
