name: Installed construction regression 110

on:
  push:
    paths:
      - 'scripts/run_prime_power_installed_construction_regression_110.py'
      - 'scripts/run_prime_power_installed_construction_regression_98.py'
      - 'scripts/check_prime_power_protected_conflict_batching_ancestry.py'
      - 'scripts/check_prime_power_installed_operation_registry_110.py'
      - 'docs/486-prime-power-installed-construction-regression-110.md'
      - 'proofs/composite-modulus-theorem-index-live-continuation-52.md'
      - '.github/workflows/installed-construction-regression-110.yml'
  pull_request:
    paths:
      - 'scripts/run_prime_power_installed_construction_regression_110.py'
      - 'scripts/run_prime_power_installed_construction_regression_98.py'
      - 'scripts/check_prime_power_protected_conflict_batching_ancestry.py'
      - 'scripts/check_prime_power_installed_operation_registry_110.py'
      - 'docs/486-prime-power-installed-construction-regression-110.md'
      - 'proofs/composite-modulus-theorem-index-live-continuation-52.md'
      - '.github/workflows/installed-construction-regression-110.yml'

jobs:
  check:
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python scripts/run_prime_power_installed_construction_regression_110.py --static-only
      - run: python scripts/run_prime_power_installed_construction_regression_110.py
