name: Product side-seven selector-aware cases 1360 through 1369

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/product-side-seven-m2-selector-aware-1360-1369.yml

permissions:
  contents: read

jobs:
  classify:
    name: case-${{ matrix.case }}-selector-${{ matrix.selector }}-orientation-${{ matrix.orientation }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        case: [1360, 1361, 1362, 1363, 1364, 1365, 1366, 1367, 1368, 1369]
        selector: [0, 1]
        orientation: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - name: Check durable trigger
        id: gate
        shell: bash
        run: |
          if grep -qx 'run-selector-aware-1360-1369' .github/product-side-seven-m2-selector-aware-1360-1369-trigger.txt; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Compile selector-aware classifier
        if: steps.gate.outputs.run == 'true'
        run: >-
          g++ -O3 -std=c++17
          scripts/measure_product_side_seven_single_selector_orientation.cpp
          -o /tmp/measure-product-side-seven-selector
      - name: Classify exact selector orientation
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -o pipefail
          /tmp/measure-product-side-seven-selector \
            "${{ matrix.case }}" "${{ matrix.selector }}" \
            "${{ matrix.orientation }}" 2 \
            | tee "side-seven-m2-${{ matrix.case }}-${{ matrix.selector }}-${{ matrix.orientation }}.txt"
          grep -q ' PASS$' "side-seven-m2-${{ matrix.case }}-${{ matrix.selector }}-${{ matrix.orientation }}.txt"
      - name: Upload exact transcript
        if: always() && steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: side-seven-m2-${{ matrix.case }}-${{ matrix.selector }}-${{ matrix.orientation }}
          path: side-seven-m2-${{ matrix.case }}-${{ matrix.selector }}-${{ matrix.orientation }}.txt
          if-no-files-found: error

# Durable registration: retain until the ten-signature mixed classification is promoted.
