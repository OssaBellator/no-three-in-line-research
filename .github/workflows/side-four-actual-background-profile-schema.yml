name: Side-four actual background profile schema

on:
  push:
    paths:
      - 'data/prime_power_side_four_selected_response_provenance_manifest.json'
      - 'data/prime_power_side_four_residual_return_credit_worklist_contract.json'
      - 'data/prime_power_side_four_symbolic_line_kernel_context_contract.json'
      - 'data/prime_power_side_four_actual_background_profile_batch.json'
      - 'scripts/check_prime_power_side_four_actual_background_profile_batch.py'
      - 'docs/564-prime-power-side-four-actual-background-profile-schema.md'
      - '.github/workflows/side-four-actual-background-profile-schema.yml'
  pull_request:
  workflow_dispatch:

jobs:
  background-profile:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python scripts/check_prime_power_side_four_actual_background_profile_batch.py
