name: Current frontier regression

on:
  push:
    branches:
      - research/all-n-composite-modulus
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: current-frontier-regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.12"
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run validator mutation tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONHASHSEED: "0"
        run: python scripts/test_prime_power_current_frontier_regression.py

      - name: Verify hard-core exchange normal form
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONHASHSEED: "0"
        run: python scripts/check_prime_power_hard_core_exchange_normal_form.py

      - name: Verify hard-core exchange realisability
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONHASHSEED: "0"
        run: python scripts/check_prime_power_hard_core_exchange_realisability.py

      - name: Prepare runtime artifact directory
        run: mkdir -p artifacts

      - name: Run strict runtime manifest audit
        run: >-
          python -B -S -s scripts/check_prime_power_reproducible_runtime_manifest.py
          --self-test
          --manifest artifacts/current-frontier-runtime-python-${{ matrix.python-version }}.json

      - name: Run current-frontier regression
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONHASHSEED: "0"
        run: python scripts/run_prime_power_current_frontier_regression.py

      - name: Upload runtime manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-frontier-runtime-python-${{ matrix.python-version }}
          path: artifacts/current-frontier-runtime-python-${{ matrix.python-version }}.json
          if-no-files-found: warn
          retention-days: 30
