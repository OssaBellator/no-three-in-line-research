name: Exact recurrent first-host reopening singleton fragility

on:
  push:
    branches:
      - research/exact-recurrent-lyapunov-audit
    paths:
      - scripts/check_exact_recurrent_first_host_reopening_singleton_fragility.py
      - data/exact_recurrent_first_host_reopening_singleton_fragility.json
      - docs/exact-recurrent-first-host-reopening-singleton-fragility.md
      - .github/workflows/exact-recurrent-first-host-reopening-singleton-fragility.yml
  pull_request:
    paths:
      - scripts/check_exact_recurrent_first_host_reopening_singleton_fragility.py
      - data/exact_recurrent_first_host_reopening_singleton_fragility.json
      - docs/exact-recurrent-first-host-reopening-singleton-fragility.md
      - .github/workflows/exact-recurrent-first-host-reopening-singleton-fragility.yml

jobs:
  audit:
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m py_compile scripts/check_exact_recurrent_first_host_reopening_singleton_fragility.py
      - run: |
          python scripts/check_exact_recurrent_first_host_reopening_singleton_fragility.py \
            --check data/exact_recurrent_first_host_reopening_singleton_fragility.json
