name: Installed operation registry 132

on:
  push:
    paths:
      - 'scripts/check_prime_power_installed_operation_registry_132.py'
      - 'docs/491-prime-power-installed-operation-registry-132.md'
      - 'proofs/composite-modulus-theorem-index-live-continuation-57.md'
      - '.github/workflows/installed-operation-registry-132.yml'
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python scripts/check_prime_power_installed_operation_registry_132.py
