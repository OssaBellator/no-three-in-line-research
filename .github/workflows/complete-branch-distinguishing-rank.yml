name: Complete branch distinguishing rank

on:
  push:
    paths:
      - 'scripts/check_prime_power_complete_branch_distinguishing_rank.py'
      - 'docs/503-prime-power-complete-branch-distinguishing-rank.md'
      - '.github/workflows/complete-branch-distinguishing-rank.yml'
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile checker
        run: python -m py_compile scripts/check_prime_power_complete_branch_distinguishing_rank.py
      - name: Run checker
        run: python scripts/check_prime_power_complete_branch_distinguishing_rank.py
