name: Essential return unit-wall frontier

on:
  push:
    branches: [research/all-n-composite-modulus]
    paths:
      - scripts/check_prime_power_essential_return_unit_wall_ancestry.py
      - docs/458-prime-power-essential-return-unit-wall-ancestry.md
      - proofs/composite-modulus-theorem-index-live-continuation-24.md
      - .github/workflows/essential-return-unit-wall-frontier.yml
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m py_compile scripts/check_prime_power_essential_return_unit_wall_ancestry.py
      - run: python scripts/check_prime_power_essential_return_unit_wall_ancestry.py
