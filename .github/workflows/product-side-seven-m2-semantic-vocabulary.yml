name: Product side-seven multiplicity-two semantic vocabulary coverage

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/product-side-seven-m2-semantic-vocabulary.yml

permissions:
  contents: read

jobs:
  measure:
    name: semantic-vocabulary
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Check durable trigger
        id: gate
        shell: bash
        run: |
          if grep -qx 'run-semantic-vocabulary' .github/product-side-seven-m2-semantic-vocabulary-trigger.txt; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Compile vocabulary measurement
        if: steps.gate.outputs.run == 'true'
        run: >-
          g++ -O3 -std=c++17
          scripts/measure_product_side_seven_multiplicity2_case0_orientation3_semantic_vocabulary.cpp
          -o /tmp/measure-semantic-vocabulary
      - name: Measure vocabulary coverage
        if: steps.gate.outputs.run == 'true'
        run: >-
          /tmp/measure-semantic-vocabulary
          | tee product-side-seven-m2-semantic-vocabulary.txt
      - name: Upload exact transcript
        if: always() && steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: product-side-seven-m2-semantic-vocabulary
          path: product-side-seven-m2-semantic-vocabulary.txt
          if-no-files-found: warn
