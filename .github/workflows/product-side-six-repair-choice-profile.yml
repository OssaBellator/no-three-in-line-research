name: Product side-six repair choice profile

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/product-side-six-repair-choice-profile.yml

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Check durable trigger
        id: gate
        shell: bash
        run: |
          if grep -qx 'run-side-six-repair-choice-profile' .github/product-side-six-repair-choice-profile-trigger.txt; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Measure exact profile
        if: steps.gate.outputs.run == 'true'
        run: >-
          python scripts/measure_product_side_six_repair_choice_profile.py
          | tee product-side-six-repair-choice-profile.txt
      - name: Upload exact transcript
        if: always() && steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: product-side-six-repair-choice-profile
          path: product-side-six-repair-choice-profile.txt
          if-no-files-found: error
