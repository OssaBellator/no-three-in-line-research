name: Rollback optimal-face SCC frontier

on:
  push:
    branches: [research/all-n-composite-modulus]
    paths:
      - scripts/check_prime_power_rollback_optimal_face_scc_ancestry.py
      - docs/462-prime-power-rollback-optimal-face-scc-ancestry.md
      - proofs/composite-modulus-theorem-index-live-continuation-28.md
      - .github/workflows/rollback-optimal-face-scc-frontier.yml
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m py_compile scripts/check_prime_power_rollback_optimal_face_scc_ancestry.py
      - run: python scripts/check_prime_power_rollback_optimal_face_scc_ancestry.py
