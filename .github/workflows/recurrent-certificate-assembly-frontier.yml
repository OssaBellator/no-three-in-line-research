name: Recurrent certificate assembly frontier

on:
  push:
    paths:
      - 'scripts/check_prime_power_recurrent_certificate_assembly_ancestry.py'
      - 'scripts/verify_prime_power_return_selector_assignment.py'
      - 'scripts/verify_prime_power_line_clean_integer_budgets.py'
      - 'scripts/verify_prime_power_critical_selector_localization.py'
      - 'scripts/verify_prime_field_root_channel_support_splice.py'
      - 'scripts/verify_prime_power_fixed_interface_thin_table.py'
      - 'scripts/verify_prime_power_label_preserving_crt_assembly.py'
      - 'docs/539-prime-power-recurrent-certificate-assembly-ancestry.md'
      - '.github/workflows/recurrent-certificate-assembly-frontier.yml'
  pull_request:
  workflow_dispatch:

jobs:
  checker:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run recurrent certificate assembly checker
        run: python scripts/check_prime_power_recurrent_certificate_assembly_ancestry.py
