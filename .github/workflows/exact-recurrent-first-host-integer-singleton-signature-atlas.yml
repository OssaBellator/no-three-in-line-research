name: Exact recurrent first-host integer singleton signature atlas

on:
  push:
    paths:
      - scripts/check_exact_recurrent_first_host_integer_singleton_signature_atlas.py
      - data/exact_recurrent_first_host_integer_singleton_signature_atlas.json
      - docs/exact-recurrent-first-host-integer-singleton-signature-atlas.md
      - .github/workflows/exact-recurrent-first-host-integer-singleton-signature-atlas.yml
  pull_request:
    paths:
      - scripts/check_exact_recurrent_first_host_integer_singleton_signature_atlas.py
      - data/exact_recurrent_first_host_integer_singleton_signature_atlas.json
      - docs/exact-recurrent-first-host-integer-singleton-signature-atlas.md
      - .github/workflows/exact-recurrent-first-host-integer-singleton-signature-atlas.yml

jobs:
  audit:
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile checker
        run: python -m py_compile scripts/check_exact_recurrent_first_host_integer_singleton_signature_atlas.py
      - name: Validate deterministic manifest and mutation audit
        run: |
          python scripts/check_exact_recurrent_first_host_integer_singleton_signature_atlas.py \
            --check data/exact_recurrent_first_host_integer_singleton_signature_atlas.json \
            | tee /tmp/singleton-atlas.json
          python - <<'PY'
          import json
          data = json.load(open('/tmp/singleton-atlas.json', encoding='utf-8'))
          assert data['integer_singleton_signature_classes'] == 15
          assert data['classes_with_minimum_zero'] == 14
          assert data['classes_with_minimum_one'] == 1
          assert data['classes_with_original_response_minimizer'] == 0
          assert data['unique_no_zero_reopening_integer_points'] == 2
          assert data['mutation_corruptions_rejected'] == 13
          assert data['multi_point_background_classification_complete'] == 0
          assert data['all_n_proved_by_checker'] == 0
          PY
